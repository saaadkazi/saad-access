<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- Vertical thread gradients (depth, 3D shape) -->
    <linearGradient id="v-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#020202" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>
    
    <!-- Horizontal thread gradients (depth, 3D shape) -->
    <linearGradient id="h-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#010101" />
      <stop offset="50%" stop-color="#0e0e0e" />
      <stop offset="100%" stop-color="#010101" />
    </linearGradient>

    <!-- Filament pattern overlays to simulate carbon thread texture -->
    <pattern id="v-filaments" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#ffffff" stroke-width="0.35" opacity="0.05" />
      <line x1="2" y1="0" x2="2" y2="4" stroke="#000000" stroke-width="0.4" opacity="0.08" />
    </pattern>

    <pattern id="h-filaments" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#ffffff" stroke-width="0.35" opacity="0.05" />
      <line x1="0" y1="2" x2="4" y2="2" stroke="#000000" stroke-width="0.4" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Dark base carbon color -->
  <rect width="64" height="64" fill="#040404" />

  <!-- 2x2 Twill weave blocks of 16x16 pixels -->
  <!-- Row 0 -->
  <rect x="0" y="0" width="16" height="16" fill="url(#v-grad)" />
  <rect x="0" y="0" width="16" height="16" fill="url(#v-filaments)" />
  <rect x="16" y="0" width="16" height="16" fill="url(#v-grad)" />
  <rect x="16" y="0" width="16" height="16" fill="url(#v-filaments)" />
  <rect x="32" y="0" width="16" height="16" fill="url(#h-grad)" />
  <rect x="32" y="0" width="16" height="16" fill="url(#h-filaments)" />
  <rect x="48" y="0" width="16" height="16" fill="url(#h-grad)" />
  <rect x="48" y="0" width="16" height="16" fill="url(#h-filaments)" />

  <!-- Row 1 -->
  <rect x="0" y="16" width="16" height="16" fill="url(#h-grad)" />
  <rect x="0" y="16" width="16" height="16" fill="url(#h-filaments)" />
  <rect x="16" y="16" width="16" height="16" fill="url(#v-grad)" />
  <rect x="16" y="16" width="16" height="16" fill="url(#v-filaments)" />
  <rect x="32" y="16" width="16" height="16" fill="url(#v-grad)" />
  <rect x="32" y="16" width="16" height="16" fill="url(#v-filaments)" />
  <rect x="48" y="16" width="16" height="16" fill="url(#h-grad)" />
  <rect x="48" y="16" width="16" height="16" fill="url(#h-filaments)" />

  <!-- Row 2 -->
  <rect x="0" y="32" width="16" height="16" fill="url(#h-grad)" />
  <rect x="0" y="32" width="16" height="16" fill="url(#h-filaments)" />
  <rect x="16" y="32" width="16" height="16" fill="url(#h-grad)" />
  <rect x="16" y="32" width="16" height="16" fill="url(#h-filaments)" />
  <rect x="32" y="32" width="16" height="16" fill="url(#v-grad)" />
  <rect x="32" y="32" width="16" height="16" fill="url(#v-filaments)" />
  <rect x="48" y="32" width="16" height="16" fill="url(#v-grad)" />
  <rect x="48" y="32" width="16" height="16" fill="url(#v-filaments)" />

  <!-- Row 3 -->
  <rect x="0" y="48" width="16" height="16" fill="url(#v-grad)" />
  <rect x="0" y="48" width="16" height="16" fill="url(#v-filaments)" />
  <rect x="16" y="48" width="16" height="16" fill="url(#h-grad)" />
  <rect x="16" y="48" width="16" height="16" fill="url(#h-filaments)" />
  <rect x="32" y="48" width="16" height="16" fill="url(#h-grad)" />
  <rect x="32" y="48" width="16" height="16" fill="url(#h-filaments)" />
  <rect x="48" y="48" width="16" height="16" fill="url(#v-grad)" />
  <rect x="48" y="48" width="16" height="16" fill="url(#v-filaments)" />
</svg>
